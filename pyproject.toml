[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dopamine_pinn"
version = "1.0.0"
description = "Inverse physics-informed neural networks and a finite-difference reference for synaptic dopamine transport"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emmanuel Hackman" }, { name = "Huiqing Zhu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "jax>=0.4.30",
    "flax>=0.10",
    "optax>=0.2.3",
    "jaxopt>=0.8",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["dopamine_pinn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
